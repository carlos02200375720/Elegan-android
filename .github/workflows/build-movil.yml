name: Build Android (APK y AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-movil.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-movil.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validar pruebas y compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Cargar primero los metadatos remotos para que sdkmanager detecte todas las licencias.
          "$SDKMANAGER" --list >/dev/null
          # La sustitución de proceso evita que SIGPIPE de "yes" aborte el paso por pipefail.
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Preparar firma debug para pruebas y compilación local
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f "debug.keystore" ]; then
            echo "debug.keystore ya existe en el espacio de trabajo."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restaurando debug.keystore desde secreto..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restaurando debug.keystore desde archivo debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "Generando nuevo debug.keystore temporal para compilación debug..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" || true

      - name: Ejecutar pruebas unitarias (puerta de calidad)
        id: unit_tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Publicar reporte de pruebas en caso de fallo
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: elegan-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preparar firma de publicación
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Validación de Pull Request: se compilará el APK debug sin firma de publicación."
            else
              echo "::warning::No se configuró la firma Android. Se generará el APK de prueba; el AAB firmado y el mapping.txt de release se omitirán."
            fi
          fi

      - name: Compilar APK firmado para distribución
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Compilar APK de prueba (debug / validación de PR)
        if: steps.signing.outputs.available != 'true'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspeccionar firma del APK generado
        run: |
          shopt -s globstar nullglob
          for apk in app/build/outputs/apk/**/*.apk; do
            echo "=== Certificado de $apk ==="
            keytool -printcert -jarfile "$apk" | grep -E "SHA1:|SHA256:" || true
          done

      - name: Publicar APK Android
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: elegan-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Compilar AAB firmado para Google Play Store
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Publicar AAB para Google Play Store
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elegan-aab-play-store
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1

      - name: Publicar archivo de mapeo R8 (mapping.txt)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elegan-r8-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Resumen de compilación Android
        if: always()
        run: |
          {
            echo "## Validación y Compilación Android"
            echo "- Pruebas unitarias (\`:app:testDebugUnitTest\`): **${{ steps.unit_tests.outcome }}**."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Pull Request: validación de pruebas y compilación debug ejecutada (sin publicación de artefactos de distribución)."
            elif [ "${{ steps.signing.outputs.available }}" = "true" ]; then
              echo "- APK firmado (release): compilado y publicado."
              echo "- AAB firmado (Google Play Store): compilado y publicado."
              echo "- Archivo de mapeo R8 (\`mapping.txt\`): respaldado como artefacto (retención 90 días)."
            else
              echo "- APK de prueba (debug): compilado y publicado."
              echo "- AAB para Google Play Store y \`mapping.txt\`: omitidos; configura los secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD y ANDROID_KEY_PASSWORD) para generarlos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
